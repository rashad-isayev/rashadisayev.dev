name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - codex/v2

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rashadisayev?schema=public
          ADMIN_PASSWORD_HASH: scrypt$16384$8$1$Y2ktdGVzdC1zYWx0$Y2ktdGVzdC1rZXk
          ADMIN_SESSION_SECRET: ci-only-session-secret-at-least-32-characters
